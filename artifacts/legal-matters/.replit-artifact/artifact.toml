kind = "web"
previewPath = "/"
title = "Legal Matter Notes"
version = "1.0.0"
id = "artifacts/legal-matters"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22569

[services.development]
run = "pnpm --filter @workspace/legal-matters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legal-matters", "run", "build" ]
publicDir = "artifacts/legal-matters/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22569"
BASE_PATH = "/"
