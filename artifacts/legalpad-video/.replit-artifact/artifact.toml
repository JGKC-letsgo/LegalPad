kind = "video"
previewPath = "/legalpad-video/"
title = "Legalpad — Product Video"
version = "1.0.0"
id = "artifacts/legalpad-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/legalpad-video/" ]
localPort = 20418

[services.development]
run = "pnpm --filter @workspace/legalpad-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legalpad-video", "run", "build" ]
publicDir = "artifacts/legalpad-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20418"
BASE_PATH = "/legalpad-video/"
